[project]
name = "coho-cli"
version = "0.1.0"
description = "The coho command: manage Coho accounts, projects, branches, releases and content from a terminal."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Coho" }]
keywords = ["coho", "cms", "headless", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]
dependencies = [
    "coho-sdk",
    "typer>=0.12",
    "rich>=13.7",
    "keyring>=25",
]

[project.scripts]
coho = "coho_cli.main:main"

[project.urls]
Documentation = "https://github.com/coho-cms/coho-cli/tree/main/docs"
Source = "https://github.com/coho-cms/coho-cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coho_cli"]
