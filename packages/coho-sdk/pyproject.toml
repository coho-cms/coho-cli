[project]
name = "coho-sdk"
version = "0.1.0"
description = "Management SDK for Coho: accounts, projects, refs, content, releases, delivery keys."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{ name = "Coho" }]
keywords = ["coho", "cms", "headless", "sdk"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
keyring = ["keyring>=25"]
testing = ["pytest-httpserver>=1.1"]

[project.urls]
Documentation = "https://github.com/coho-cms/coho-cli/tree/main/docs"
Source = "https://github.com/coho-cms/coho-cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coho_sdk"]
