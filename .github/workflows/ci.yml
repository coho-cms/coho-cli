name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  FORCE_COLOR: "1"

jobs:
  test:
    name: test · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.13"
    defaults:
      run:
        working-directory: coho-cli
    steps:
      - uses: actions/checkout@v7
        with:
          path: coho-cli

      # The CLI develops against a sibling checkout of the library, which is what
      # `[tool.uv.sources]` in pyproject.toml points at. A public repository needs no
      # extra credential; a private one would need a PAT in `token:`.
      - uses: actions/checkout@v7
        with:
          repository: coho-cms/coho-management-sdk-python
          path: coho-management-sdk-python
          # The library's release branch, not its default branch: this CLI needs
          # the 2026.1 line, which lives there. Spelled out as a branch because the
          # release tag v2026.1.0 will share its name.
          ref: refs/heads/v2026.1.0
          # The library's version comes from its tags. A shallow clone has none and
          # builds 0.1.dev1, which the version range above refuses.
          fetch-depth: 0

      - name: Install uv
        # An exact release: setup-uv stopped publishing floating major tags at v8,
        # so `@v10` would not resolve.
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }} # without this every job used the same Python
          enable-cache: true
          cache-dependency-glob: coho-cli/uv.lock

      - name: Install the project
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest

  build:
    name: build distributions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # An exact release: setup-uv stopped publishing floating major tags at v8,
        # so `@v10` would not resolve.
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Build metadata comes from [project], never from [tool.uv.sources], so the
      # wheel depends on the published coho-management-sdk even though development does not.
      - name: Build the wheel and the sdist
        run: uv build --out-dir dist

      - name: Refuse a tag that disagrees with the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          expected="dist/coho_cli-${GITHUB_REF_NAME#v}-py3-none-any.whl"
          if [ ! -f "$expected" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version in pyproject.toml"
            echo "expected $expected, built:"
            ls -1 dist
            exit 1
          fi

      - name: Check the packaging metadata
        run: uvx twine check --strict dist/*.whl dist/*.tar.gz

      - name: Upload the distributions
        uses: actions/upload-artifact@v7
        with:
          name: coho-cli-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 90

  release:
    name: attach to the GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@v8
        with:
          name: coho-cli-dist
          path: dist

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.whl dist/*.tar.gz \
              --repo "$GITHUB_REPOSITORY" \
              --title "coho-cli $GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi

  publish-pypi:
    name: publish to PyPI
    # Skipped unless the repository variable PUBLISH_TO_PYPI is "true". See CONTRIBUTING.md.
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_TO_PYPI == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/coho-cli/
    permissions:
      id-token: write
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@v8
        with:
          name: coho-cli-dist
          path: dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
