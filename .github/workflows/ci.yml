name: ci

on:
  push:
    branches: [main]
    tags: ["release-v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  FORCE_COLOR: "1"

jobs:
  test:
    name: test · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.13"
    defaults:
      run:
        working-directory: coho-cli
    steps:
      - uses: actions/checkout@v7
        with:
          path: coho-cli
          # Every commit and tag: the version is computed from them, and a shallow
          # clone makes it a meaningless 0.1.dev1.
          fetch-depth: 0

      # The CLI develops against a sibling checkout of the library, which is what
      # `[tool.uv.sources]` in pyproject.toml points at. A public repository needs no
      # extra credential; a private one would need a PAT in `token:`.
      - uses: actions/checkout@v7
        with:
          repository: coho-cms/coho-management-sdk-python
          path: coho-management-sdk-python
          # The library's release branch, not its default branch: the branch named
          # for the version every Coho repository is working towards, which this
          # CLI's own branch shares. Spelled out as a branch because the release tag
          # v2026.2.1 will share its name. Move it with the CLI's branch.
          ref: refs/heads/v2026.2.7
          # The library's version comes from its tags. A shallow clone has none and
          # builds 0.1.dev1, which the version range above refuses.
          fetch-depth: 0

      - name: Install uv
        # An exact release: setup-uv stopped publishing floating major tags at v8,
        # so `@v10` would not resolve.
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }} # without this every job used the same Python
          enable-cache: true
          cache-dependency-glob: coho-cli/uv.lock

      - name: Install the project
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest

  build:
    name: build distributions
    needs: test
    runs-on: ubuntu-latest
    outputs:
      # The wheel's version, 2026.2.4 or 2026.2.5a1.dev3: what every package is named for.
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Every commit and tag: the version is computed from them, and a shallow
          # clone makes it a meaningless 0.1.dev1.
          fetch-depth: 0

      - name: Install uv
        # An exact release: setup-uv stopped publishing floating major tags at v8,
        # so `@v10` would not resolve.
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Refuse a dev-version tag
        # Dev versions come from commits after a release (2026.1.0a2.dev3), never
        # from tags. A tag like release-v2026.1.0.dev1 also makes every later build fail,
        # because setuptools-scm cannot number a dev build of a dev build.
        if: startsWith(github.ref, 'refs/tags/release-v')
        run: |
          if [[ "$GITHUB_REF_NAME" =~ [.-]?dev[0-9]*$ ]]; then
            echo "::error::Don't tag dev versions: every commit after a release already builds one."
            echo "Delete this tag (git push --delete origin $GITHUB_REF_NAME), or every later build fails."
            exit 1
          fi

      # Build metadata comes from [project], never from [tool.uv.sources], so the
      # wheel depends on the published coho-management-sdk even though development does not.
      - name: Build the wheel and the sdist
        run: uv build --out-dir dist

      - name: Read the version
        id: version
        run: echo "version=$(basename dist/*.whl | cut -d- -f2)" >> "$GITHUB_OUTPUT"

      - name: Refuse a tag that is not a version in its standard form
        # The version comes from the tag less its `release-v`, normalized to PEP 440:
        # `release-v2026.1.0-rc.1`
        # builds 2026.1.0rc1. A tag that does not match its own build would mislead
        # anyone comparing the two, so the wheel's filename is the check.
        if: startsWith(github.ref, 'refs/tags/release-v')
        run: |
          expected="dist/coho_cli-${GITHUB_REF_NAME#release-v}-py3-none-any.whl"
          if [ ! -f "$expected" ]; then
            echo "::error::tag $GITHUB_REF_NAME is not a version in PEP 440's standard form."
            echo "Use forms like release-v2026.1.0, release-v2026.1.0a1, release-v2026.1.0b1 or release-v2026.1.0rc1. Built instead:"
            ls -1 dist
            exit 1
          fi

      - name: Check the packaging metadata
        run: uvx twine check --strict dist/*.whl dist/*.tar.gz

      - name: Upload the distributions
        uses: actions/upload-artifact@v7
        with:
          name: coho-cli-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 90

  binaries:
    # A standalone `coho` per platform, frozen with PyInstaller: its own Python and every
    # dependency, for people who have no Python. macOS is archived here, unsigned; the
    # Windows folder goes on to a windows-installer job, which signs it on a release.
    name: binary · ${{ matrix.target }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos-arm64
          - os: windows-latest
            target: windows-x64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: packaging

      # The wheel the build job made, so the binary is exactly what PyPI users install.
      - name: Download the distributions
        uses: actions/download-artifact@v8
        with:
          name: coho-cli-dist
          path: dist

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"

      - name: Install the wheel and PyInstaller
        run: |
          uv venv .bin-venv
          # The SDK comes from PyPI: release coho-management-sdk before a CLI that needs it.
          uv pip install --python .bin-venv ./dist/*.whl "pyinstaller==6.22.3"

      - name: Freeze
        run: |
          bin=.bin-venv/bin; [ "$RUNNER_OS" = Windows ] && bin=.bin-venv/Scripts
          "$bin/python" -m PyInstaller --noconfirm --clean \
            --distpath bin-dist --workpath bin-build packaging/pyinstaller/coho.spec

      - name: Run it
        run: |
          exe=bin-dist/coho/coho; [ "$RUNNER_OS" = Windows ] && exe=bin-dist/coho/coho.exe
          version=$(basename dist/*.whl | cut -d- -f2)
          "$exe" --version | tee version.txt
          grep -F "v$version" version.txt
          "$exe" --help > /dev/null
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Archive
        if: runner.os != 'Windows'
        run: |
          tar -C bin-dist -czf "coho-$VERSION-${{ matrix.target }}.tar.gz" coho
          ls -l coho-*

      - name: Upload the binary
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: coho-binary-${{ matrix.target }}
          path: coho-*.tar.gz
          if-no-files-found: error
          retention-days: 90

      # The frozen folder itself, for the windows-installer jobs to sign and package. Not a
      # release asset: its name keeps it out of the release job's `coho-*` pattern.
      - name: Upload the frozen folder
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: frozen-${{ matrix.target }}
          path: bin-dist/coho
          if-no-files-found: error
          retention-days: 7

  windows-installer:
    # The zip and the MSI, unsigned: every push and pull request, and a release tag while
    # signing is off. Installs the MSI, runs `coho`, and uninstalls it again.
    name: windows installer · unsigned
    if: ${{ !(startsWith(github.ref, 'refs/tags/release-v') && vars.WINDOWS_SIGNING == 'true') }}
    needs: [build, binaries]
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: packaging

      - name: Download the frozen folder
        uses: actions/download-artifact@v8
        with:
          name: frozen-windows-x64
          path: frozen/coho

      - name: Build the zip and the MSI
        run: ./packaging/windows/build.ps1 -Version $env:VERSION -Frozen frozen/coho -OutDir out

      - name: Install, run, and uninstall
        run: ./packaging/windows/test-install.ps1 -Msi "out/coho-$env:VERSION-windows-x64.msi" -Version $env:VERSION

      - name: Upload the zip and the MSI
        uses: actions/upload-artifact@v7
        with:
          name: coho-binary-windows-x64
          path: |
            out/*.zip
            out/*.msi
          if-no-files-found: error
          retention-days: 90

  windows-installer-signed:
    # The same as windows-installer, with coho.exe signed before it is packaged and the MSI
    # signed after, by Azure Artifact Signing. Release tags only, once the repository
    # variable WINDOWS_SIGNING is "true"; CONTRIBUTING.md has the Azure setup. Exactly one
    # of the two jobs runs, and both upload coho-binary-windows-x64.
    name: windows installer · signed
    if: startsWith(github.ref, 'refs/tags/release-v') && vars.WINDOWS_SIGNING == 'true'
    needs: [build, binaries]
    runs-on: windows-latest
    # The environment holds the Azure identity and only release-v* tags may use it, so a
    # branch cannot sign with Coho's name.
    environment: windows-signing
    permissions:
      contents: read
      id-token: write # OIDC: azure/login exchanges it for a token, no client secret stored
    env:
      VERSION: ${{ needs.build.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: packaging

      - name: Download the frozen folder
        uses: actions/download-artifact@v8
        with:
          name: frozen-windows-x64
          path: frozen/coho

      - name: Sign in to Azure
        uses: azure/login@v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign coho.exe
        uses: azure/artifact-signing-action@v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\frozen\coho\coho.exe
          description: Coho CLI
          description-url: https://github.com/coho-cms/coho-cli

      - name: Build the zip and the MSI
        run: ./packaging/windows/build.ps1 -Version $env:VERSION -Frozen frozen/coho -OutDir out

      - name: Sign the MSI
        uses: azure/artifact-signing-action@v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\out\coho-${{ env.VERSION }}-windows-x64.msi
          description: Coho CLI
          description-url: https://github.com/coho-cms/coho-cli

      - name: Check the signatures
        run: |
          foreach ($file in "frozen/coho/coho.exe", "out/coho-$env:VERSION-windows-x64.msi") {
            $signature = Get-AuthenticodeSignature $file
            Write-Host "$file`: $($signature.Status), $($signature.SignerCertificate.Subject)"
            if ($signature.Status -ne 'Valid') { throw "$file is not validly signed" }
          }

      - name: Install, run, and uninstall
        run: ./packaging/windows/test-install.ps1 -Msi "out/coho-$env:VERSION-windows-x64.msi" -Version $env:VERSION

      - name: Upload the zip and the MSI
        uses: actions/upload-artifact@v7
        with:
          name: coho-binary-windows-x64
          path: |
            out/*.zip
            out/*.msi
          if-no-files-found: error
          retention-days: 90

  release:
    name: attach to the GitHub release
    # One of the two windows-installer jobs is always skipped, and a skipped need skips
    # this job too unless the condition says otherwise: run when nothing failed.
    if: startsWith(github.ref, 'refs/tags/release-v') && !cancelled() && !failure()
    needs: [build, binaries, windows-installer, windows-installer-signed]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: packaging

      - name: Download the distributions and the binaries
        uses: actions/download-artifact@v8
        with:
          pattern: coho-*
          path: dist
          merge-multiple: true

      - name: Winget manifests
        # For the MSI this release carries, to copy into a winget-pkgs pull request:
        # CONTRIBUTING.md has the steps. Pre-releases get them too, but only finals go to
        # winget.
        run: |
          python3 packaging/windows/winget_manifest.py "$VERSION" \
            "dist/coho-$VERSION-windows-x64.msi" winget
          (cd winget && zip -qr "../dist/coho-$VERSION-winget-manifests.zip" manifests)
          cat winget/manifests/c/CohoCMS/CLI/"$VERSION"/*.installer.yaml

      - name: Copies under names without the version
        # So a website can link to releases/latest/download/coho-windows-x64.msi and never
        # change the link. GitHub's "latest" is the newest final release, so a pre-release
        # carrying these too never moves what such a link serves.
        run: |
          cd dist
          for platform in windows-x64.msi windows-x64.zip macos-arm64.tar.gz; do
            cp "coho-$VERSION-$platform" "coho-$platform"
          done
          ls -l

      - name: Checksums
        run: |
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # An alpha, beta or release candidate is a pre-release on GitHub too, so
          # it never shows as the latest release.
          prerelease=""
          if [[ "$GITHUB_REF_NAME" =~ (a|b|rc)[0-9]+$ ]]; then
            prerelease="--prerelease"
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "coho-cli ${GITHUB_REF_NAME#release-v}" \
              --generate-notes \
              --verify-tag $prerelease
          fi

  publish-pypi:
    name: publish to PyPI
    # Skipped unless the repository variable PUBLISH_TO_PYPI is "true". See CONTRIBUTING.md.
    if: startsWith(github.ref, 'refs/tags/release-v') && vars.PUBLISH_TO_PYPI == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/coho-cli/
    permissions:
      id-token: write
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@v8
        with:
          name: coho-cli-dist
          path: dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
