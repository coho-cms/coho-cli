name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  FORCE_COLOR: "1"

jobs:
  test:
    name: test · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.13"
    defaults:
      run:
        working-directory: coho-cli
    steps:
      - uses: actions/checkout@v7
        with:
          path: coho-cli
          # Every commit and tag: the version is computed from them, and a shallow
          # clone makes it a meaningless 0.1.dev1.
          fetch-depth: 0

      # The CLI develops against a sibling checkout of the library, which is what
      # `[tool.uv.sources]` in pyproject.toml points at. A public repository needs no
      # extra credential; a private one would need a PAT in `token:`.
      - uses: actions/checkout@v7
        with:
          repository: coho-cms/coho-management-sdk-python
          path: coho-management-sdk-python
          # The library's release branch, not its default branch: this CLI needs
          # the 2026.1 line, which lives there. Spelled out as a branch because the
          # release tag v2026.1.0 will share its name.
          ref: refs/heads/v2026.1.0
          # The library's version comes from its tags. A shallow clone has none and
          # builds 0.1.dev1, which the version range above refuses.
          fetch-depth: 0

      - name: Install uv
        # An exact release: setup-uv stopped publishing floating major tags at v8,
        # so `@v10` would not resolve.
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }} # without this every job used the same Python
          enable-cache: true
          cache-dependency-glob: coho-cli/uv.lock

      - name: Install the project
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Test
        run: uv run pytest

  build:
    name: build distributions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Every commit and tag: the version is computed from them, and a shallow
          # clone makes it a meaningless 0.1.dev1.
          fetch-depth: 0

      - name: Install uv
        # An exact release: setup-uv stopped publishing floating major tags at v8,
        # so `@v10` would not resolve.
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Refuse a dev-version tag
        # Dev versions come from commits after a release (2026.1.0a2.dev3), never
        # from tags. A tag like v2026.1.0.dev1 also makes every later build fail,
        # because setuptools-scm cannot number a dev build of a dev build.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          if [[ "$GITHUB_REF_NAME" =~ [.-]?dev[0-9]*$ ]]; then
            echo "::error::Don't tag dev versions: every commit after a release already builds one."
            echo "Delete this tag (git push --delete origin $GITHUB_REF_NAME), or every later build fails."
            exit 1
          fi

      # Build metadata comes from [project], never from [tool.uv.sources], so the
      # wheel depends on the published coho-management-sdk even though development does not.
      - name: Build the wheel and the sdist
        run: uv build --out-dir dist

      - name: Refuse a tag that is not a version in its standard form
        # The version comes from the tag, but normalized to PEP 440: `v2026.1.0-rc.1`
        # builds 2026.1.0rc1. A tag that does not match its own build would mislead
        # anyone comparing the two, so the wheel's filename is the check.
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          expected="dist/coho_cli-${GITHUB_REF_NAME#v}-py3-none-any.whl"
          if [ ! -f "$expected" ]; then
            echo "::error::tag $GITHUB_REF_NAME is not a version in PEP 440's standard form."
            echo "Use forms like v2026.1.0, v2026.1.0a1, v2026.1.0b1 or v2026.1.0rc1. Built instead:"
            ls -1 dist
            exit 1
          fi

      - name: Check the packaging metadata
        run: uvx twine check --strict dist/*.whl dist/*.tar.gz

      - name: Upload the distributions
        uses: actions/upload-artifact@v7
        with:
          name: coho-cli-dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 90

  binaries:
    # A standalone `coho` per platform, frozen with PyInstaller: its own Python and every
    # dependency, for people who have no Python. Unsigned for now.
    name: binary · ${{ matrix.target }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos-arm64
          - os: windows-latest
            target: windows-x64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: packaging

      # The wheel the build job made, so the binary is exactly what PyPI users install.
      - name: Download the distributions
        uses: actions/download-artifact@v8
        with:
          name: coho-cli-dist
          path: dist

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.13"

      - name: Install the wheel and PyInstaller
        run: |
          uv venv .bin-venv
          # The SDK comes from PyPI: release coho-management-sdk before a CLI that needs it.
          uv pip install --python .bin-venv ./dist/*.whl "pyinstaller==6.22.3"

      - name: Freeze
        run: |
          bin=.bin-venv/bin; [ "$RUNNER_OS" = Windows ] && bin=.bin-venv/Scripts
          "$bin/python" -m PyInstaller --noconfirm --clean \
            --distpath bin-dist --workpath bin-build packaging/pyinstaller/coho.spec

      - name: Run it
        run: |
          exe=bin-dist/coho/coho; [ "$RUNNER_OS" = Windows ] && exe=bin-dist/coho/coho.exe
          version=$(basename dist/*.whl | cut -d- -f2)
          "$exe" --version | tee version.txt
          grep -F "v$version" version.txt
          "$exe" --help > /dev/null
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Archive
        run: |
          name="coho-$VERSION-${{ matrix.target }}"
          if [ "$RUNNER_OS" = Windows ]; then
            (cd bin-dist && 7z a -tzip "../$name.zip" coho > /dev/null)
          else
            tar -C bin-dist -czf "$name.tar.gz" coho
          fi
          ls -l coho-*

      - name: Upload the binary
        uses: actions/upload-artifact@v7
        with:
          name: coho-binary-${{ matrix.target }}
          path: |
            coho-*.tar.gz
            coho-*.zip
          if-no-files-found: error
          retention-days: 90

  release:
    name: attach to the GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the distributions and the binaries
        uses: actions/download-artifact@v8
        with:
          pattern: coho-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # An alpha, beta or release candidate is a pre-release on GitHub too, so
          # it never shows as the latest release.
          prerelease=""
          if [[ "$GITHUB_REF_NAME" =~ (a|b|rc)[0-9]+$ ]]; then
            prerelease="--prerelease"
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "coho-cli $GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag $prerelease
          fi

  publish-pypi:
    name: publish to PyPI
    # Skipped unless the repository variable PUBLISH_TO_PYPI is "true". See CONTRIBUTING.md.
    if: startsWith(github.ref, 'refs/tags/v') && vars.PUBLISH_TO_PYPI == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/coho-cli/
    permissions:
      id-token: write
    steps:
      - name: Download the distributions
        uses: actions/download-artifact@v8
        with:
          name: coho-cli-dist
          path: dist

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
