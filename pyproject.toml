[project]
name = "coho-cli"
# From git tags (hatch-vcs): tag v2026.1.0a1 builds 2026.1.0a1, and commits after it
# build 2026.1.0a2.devN. CONTRIBUTING.md has the release steps.
dynamic = ["version"]
description = "The coho command: manage Coho accounts, projects, branches, releases and content from a terminal."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Coho" }]
keywords = ["coho", "cms", "headless", "cli", "content"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    # Any 2026.1 SDK. A pre-release floor admits pre-releases, which installers
    # skip otherwise: 2026.1.0a1, the dev builds after it (2026.1.0a2.devN), the
    # betas and release candidates, then 2026.1.0 and its fixes. `<2026.2` keeps
    # out 2026.2 and its pre-releases.
    "coho-management-sdk>=2026.1.0a1,<2026.2",
    "typer>=0.12",
    "rich>=13.7",
    "keyring>=25",
]

[project.scripts]
coho = "coho_cli.main:main"

[project.urls]
Homepage = "https://github.com/coho-cms/coho-cli"
Source = "https://github.com/coho-cms/coho-cli"
Documentation = "https://github.com/coho-cms/coho-cli/tree/main/docs"
Changelog = "https://github.com/coho-cms/coho-cli/blob/main/CHANGELOG.md"
Issues = "https://github.com/coho-cms/coho-cli/issues"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# No "+g1a2b3c" suffix: a local version cannot be uploaded to an index.
local_scheme = "no-local-version"

[tool.hatch.build.targets.wheel]
packages = ["src/coho_cli"]

[tool.uv.sources]
# Develop against a sibling checkout of the library:
#   git clone https://github.com/coho-cms/coho-management-sdk-python ../coho-management-sdk-python
# `uv sync --no-sources` resolves coho-management-sdk from the package index instead, which is
# what a user installing `coho-cli` gets. Sources do not affect the built wheel's
# metadata either way.
coho-management-sdk = { path = "../coho-management-sdk-python", editable = true }

[dependency-groups]
dev = [
    # The suite runs against coho_management_sdk.testing.FakeBff, which the library's `testing`
    # extra provides. Declaring it here rather than restating its dependencies keeps
    # the fake's requirements the library's business.
    "coho-management-sdk[testing]",
    "pytest>=8.3",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Python only. Recent ruff also formats Python blocks inside Markdown, which would
# rewrite the deliberately aligned samples in docs/.
include = ["*.py", "*.pyi", "pyproject.toml"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["pytest_httpserver.*", "werkzeug.*", "keyring.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
